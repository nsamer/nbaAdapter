server.port=${PORT:8065}
server.servlet.context-path=/
spring.application.name=NBA adaptor
spring.main.banner-mode=off

management.endpoints.web.base-path=/status
management.endpoints.web.path-mapping.info=version
management.endpoints.web.exposure.include=health,info
management.endpoints.enabled-by-default=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=diskSpace
management.endpoint.health.group.readiness.include=diskSpace,cdh,mock
management.endpoint.health.validate-group-membership=false
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.show-details=always
management.info.git.mode=simple
management.info.git.enabled=true
management.info.build.enabled=true

info.app.name=${spring.application.name}
info.app.encoding=@project.build.sourceEncoding@
info.app.java.source=@java.version@
info.app.java.target=@java.version@

spring.config.import=classpath:conf/common.properties,classpath:conf/${teleEnv}.yaml

springdoc.show-actuator=true